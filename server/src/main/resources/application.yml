server:
  port: 8080

spring:
  application:
    name: buyer-show-server

  # MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/buyershow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: rootpass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 600000

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

  # RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: app
    password: devpassword

  # Multipart upload boundary
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  secret: buyer-show-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  access-token-expiration: 1800000   # 30 minutes
  refresh-token-expiration: 604800000 # 7 days

# MinIO
minio:
  endpoint: http://localhost:9000
  public-url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: buyershow-images

# SpringDoc
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Logging
logging:
  level:
    com.buyershow: debug
    org.springframework.security: info
