# 生产环境配置
# 启动方式: --spring.profiles.active=prod
# 所有敏感配置必须通过环境变量注入，不提供默认值

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
  
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

# JWT 配置 - 生产环境必须使用强密钥
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 3600      # 1 小时
  refresh-token-validity: 604800   # 7 天

# MinIO 配置
minio:
  endpoint: ${MINIO_ENDPOINT}
  public-url: ${MINIO_PUBLIC_URL}
  cdn-url: ${MINIO_CDN_URL:}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET:buyershow-images}

# 日志配置 - 生产环境关闭 DEBUG
logging:
  level:
    root: INFO
    com.buyershow: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 关闭 Swagger UI（生产环境不需要）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 服务器配置
server:
  tomcat:
    max-threads: 200
    accept-count: 100
